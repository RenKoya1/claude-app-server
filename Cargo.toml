[workspace]
resolver = "2"
members = [
    "crates/claude-app-server-protocol",
    "crates/claude-app-server-transport",
    "crates/claude-app-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

claude-app-server-protocol = { path = "crates/claude-app-server-protocol" }
claude-app-server-transport = { path = "crates/claude-app-server-transport" }
